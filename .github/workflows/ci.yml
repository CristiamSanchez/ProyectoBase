name: CI - ProyectoBase

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ProyectoBase.slnx

      - name: Build solution
        run: dotnet build ProyectoBase.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Proyecto.Tests/Proyecto.Tests.csproj --configuration Release --no-build

      - name: Run integration tests
        run: dotnet test tests/Proyecto.IntegrationTests/Proyecto.IntegrationTests.csproj --configuration Release --no-build
